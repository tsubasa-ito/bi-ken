name: BiKen
options:
  bundleIdPrefix: com.tebasakin
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

schemes:
  BiKen:
    build:
      targets:
        BiKen: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BiKen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Data
      - Extensions
      - Models
      - Services
      - ViewModels
      - Views
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 美術検定
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tebasakin.biken
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 6CGGS6SX69
