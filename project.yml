name: BiKen
options:
  bundleIdPrefix: com.tebasakin
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

schemes:
  BiKen:
    build:
      targets:
        BiKen: all
        BiKenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BiKenTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BiKenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/BiKenTests
    dependencies:
      - target: BiKen
        embed: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  BiKen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Data
      - Extensions
      - Models
      - Services
      - ViewModels
      - Views
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 美術検定
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GADApplicationIdentifier: $(GAD_APPLICATION_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tebasakin.biken
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 6CGGS6SX69
      configs:
        Debug:
          GAD_APPLICATION_IDENTIFIER: ca-app-pub-3940256099942544~1458002511
        Release:
          GAD_APPLICATION_IDENTIFIER: ca-app-pub-6267199278067658~4644940714
