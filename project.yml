name: BiKen
options:
  bundleIdPrefix: com.tebasaki
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.3.0"
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

schemes:
  BiKen:
    build:
      targets:
        BiKen: all
        BiKenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BiKenTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BiKenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/BiKenTests
    dependencies:
      - target: BiKen
        embed: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  BiKen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Data
      - Extensions
      - Models
      - Services
      - ViewModels
      - Views
    resources:
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: FirebaseSDK
        product: FirebaseCrashlytics
      - package: FirebaseSDK
        product: FirebaseAnalytics
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 美術検定
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GADApplicationIdentifier: $(GAD_APPLICATION_IDENTIFIER)
    postBuildScripts:
      - name: Firebase Crashlytics dSYM Upload
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ -f "${SRCROOT}/GoogleService-Info.plist" ]; then
            GOOGLE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "${SRCROOT}/GoogleService-Info.plist")
            export GOOGLE_APP_ID
            "${BUILD_DIR%Build/*}SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}"
          - "${SRCROOT}/GoogleService-Info.plist"
          - "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tebasaki.biken
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 6CGGS6SX69
      configs:
        Debug:
          GAD_APPLICATION_IDENTIFIER: ca-app-pub-3940256099942544~1458002511
        Release:
          GAD_APPLICATION_IDENTIFIER: ca-app-pub-6267199278067658~4644940714
